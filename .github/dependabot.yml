version: 2
updates:
  # bun の依存(package.json + bun.lock)
  # "npm" だと bun.lock が更新されず、CI の `bun install --frozen-lockfile` が必ず落ちる
  - package-ecosystem: "bun"
    directory: "/"
    ignore:
      # dependency-cruiser が typescript >=7 を解釈できず、層境界の検証が素通りする(0 modules cruised)。
      # 対応版が出るまでメジャー更新は止める
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      # 開発依存をまとめて更新
      dev-dependencies:
        dependency-type: "development"
      # 同じスコープのパッケージをまとめて
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      better-auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"
      observability:
        patterns:
          - "@sentry/*"
          - "posthog-*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
